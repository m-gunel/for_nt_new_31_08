# Конфиг для прогона тестов (pyproject.toml [tool.pytest_env], tests/conftest.py),
# не для демона — для него свой по образцу cfg/example.yml.
# Удалять нельзя: без CONFIG_PATH выпадает init_settings, и Config(...) в тестах
# молча игнорирует свои аргументы, читая общий user_conf.yml.

file_scan_cfg:
  # Пути каждый тест задаёт сам через monkeypatch.
  paths: []
embed_model_cfg:
  model_path: models/rubert-tiny2_002

app_logging_level: DEBUG
