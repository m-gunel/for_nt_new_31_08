# Конфиг запакованного индексатора (dist/main/main), не для запуска из репозитория.
# Кладётся в distro.zip (dist_extras); .deb ставит его как /etc/lib-local-rag/distro.yml.
#
# Демон сам начинает индексацию при старте; управление — агент через MCP-мост
# или HTTP API. POST /api/v1/deactivate действует до рестарта демона.
# autostart_indexing: false — отладочный режим, демон ждёт POST /api/v1/activate.
#
# Секции embed_model_cfg нет намеренно: относительный model_path перебьёт
# умолчание sys._MEIPASS/models/... из src/config.py, и демон упадёт на прогреве.

autostart_indexing: true

file_scan_cfg:
  # /home, а не `~`: у пользователя SberOS два каталога — `/home/sigma.sbrf.ru@ЛОГИН`
  # (графическая сессия) и `/home/work/ЛОГИН@sigma.sbrf.ru` (терминал). Демон читает
  # только открытое ему правами; у root юниты не стартуют (ConditionUser=!@system).
  #
  # Под inotify попадает каждый вложенный подкаталог, кроме мусорных (скрытые,
  # node_modules, venv…); упрётесь в лимит — поднимите его
  # (`sysctl fs.inotify.max_user_watches=524288`) или задайте file_scan_cfg.max_depth.
  #
  # Список перебивается сохранённым ~/.ragsearch/user_conf.yml: там, где он есть,
  # меняйте через POST /api/v1/config или удалите user_conf.yml.
  paths:
    - "/home"
  max_size: 104857600 # 100 МиБ

email_poll_interval: 3600
email:
  # Выключена: индекс сильно растёт, а первый проход по большому mbox выглядит
  # как зависание. Включать через POST /api/v1/config, а не правкой файла.
  enabled: false
  index_last_n_days: 90

app_logging_level: INFO
