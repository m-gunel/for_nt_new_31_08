# Конфиг для ЗАПАКОВАННОГО индексатора (dist/main/main), а не для запуска из
# репозитория. Кладётся в distro.zip целью dist_extras, а пакет .deb ставит его
# как /etc/lib-local-rag/distro.yml (conffile).
#
# Бесшовная поставка: демон при старте сразу начинает индексацию и работает
# сам, без вмешательства пользователя. Единственный интерфейс управления —
# кодинговый агент через MCP-мост (local_add_path и др.) или HTTP API.
#
# Выключение через POST /api/v1/deactivate живёт до рестарта демона: состояние
# «выключено» демону хранить не нужно, после перезагрузки индексация
# возобновляется сама. Полностью отключить автостарт — autostart_indexing:
# false (отладочный режим: демон ждёт POST /api/v1/activate).
#
# ГЛАВНОЕ ОТЛИЧИЕ от cfg/example.yml: здесь НЕТ секции embed_model_cfg.
# Это не упущение. В PyInstaller-бандле модель лежит внутри распаковочного
# каталога, и умолчание в src/config.py собирается как sys._MEIPASS/models/...
# Стоит написать здесь `model_path: models/rubert-tiny2_002` — относительный
# путь перебьёт умолчание, начнёт резолвиться от текущего каталога, и демон
# упадёт на прогреве модели. Молчание — единственный способ получить верный путь.

autostart_indexing: true

file_scan_cfg:
  # Корень /home целиком, а не `~`. У пользователя SberOS два каталога:
  # домашний из passwd `/home/sigma.sbrf.ru@ЛОГИН` (графическая сессия,
  # «Загрузки») и «папка разработчика» `/home/work/ЛОГИН@sigma.sbrf.ru`, где
  # живёт терминал. Оба лежат под /home, и разбирать имя не требуется. Демон
  # работает от имени пользователя и читает только то, что открыто ему
  # правами. У root таких ограничений нет, поэтому у root и системных учёток
  # юниты не стартуют (ConditionUser=!@system).
  #
  # Раньше здесь стоял список рабочих папок, потому что под наблюдение inotify
  # попадает каждый вложенный подкаталог и большое дерево упирается в
  # fs.inotify.max_user_watches. Теперь это учтено: мусорные каталоги
  # (.cache, node_modules, .git, venv) не получают наблюдения вовсе, отказ по
  # одному пути больше не выключает наблюдение по остальным, а пропущенное
  # подбирает периодический полный проход (full_rescan_interval). Если лимит
  # всё же мал, его можно поднять
  # (`sysctl fs.inotify.max_user_watches=524288`) либо ограничить глубину
  # наблюдения параметром file_scan_cfg.max_depth.
  #
  # ВНИМАНИЕ: этот список перебивается сохранённым ~/.ragsearch/user_conf.yml.
  # На машине, где конфиг уже сохранён, правка YAML не даст ничего — нужен
  # POST /api/v1/config или удаление user_conf.yml.
  paths:
    - "/home"
  max_size: 104857600 # 100 МиБ

email_poll_interval: 3600
email:
  # Выключена: включение существенно увеличивает индекс, а первый проход по
  # многогигабайтному mbox выглядит как зависание. Включать осознанно — через
  # POST /api/v1/config, а не правкой этого файла.
  enabled: false
  index_last_n_days: 90

app_logging_level: INFO
