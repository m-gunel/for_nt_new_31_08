file_scan_cfg: # список директорий для сканирования
  # Под inotify попадает каждый вложенный подкаталог, кроме мусорных (скрытые,
  # node_modules, venv…); упрётесь в лимит — поднимите его
  # (`sysctl fs.inotify.max_user_watches=524288`) или задайте file_scan_cfg.max_depth.
  #
  # Список перебивается сохранённым ~/.ragsearch/user_conf.yml: там, где он есть,
  # меняйте через POST /api/v1/config или удалите user_conf.yml.
  #
  # /home — общий корень обеих форм путей SberOS (`/home/sigma.sbrf.ru@ЛОГИН` и
  # `/home/work/ЛОГИН@sigma.sbrf.ru`), от HOME не зависит. Обходится всё, что
  # в /home открыто пользователю правами, а не только его дом; `~` дал бы
  # один каталог — текущий $HOME.
  paths:
    - "/home"
embed_model_cfg:
  model_path: models/rubert-tiny2_002

# user_home: /home/work/<логин>@sigma.sbrf.ru  # переопределить домашний каталог
email_poll_interval: 60
email:
  enabled: false # управляем индексацией почты
  index_last_n_days: 30
# Пороги размера для почты. Порог письма должен быть выше порога вложения:
# вложение лежит в письме в base64 и занимает примерно на треть больше.
email_scan_cfg:
  max_message_size: 50331648 # 48 МиБ
  max_attachment_size: 31457280 # 30 МиБ
app_logging_level: INFO
# Полнотекстовый индекс (BM25), умолчания — в src/common/fts.py. Индекс с другими
# параметрами пересобирается при старте демона (секунды, эмбеддинги не пересчитываются).
# fts_cfg:
#   max_token_length: 100 # в байтах UTF-8: кириллица — два байта на букву
