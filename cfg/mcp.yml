# Конфиг для запуска демона под MCP-мост.
#
# Прежняя версия файла была настроена под машину разработчика: рабочие папки
# по именам плюс домашний каталог целиком, и включённая почта. На чужой машине
# такой конфиг ставит под индексацию весь ~ и лезет в ~/.thunderbird. Здесь
# обезличенный набор — правьте paths под себя.

file_scan_cfg:
  # Весь домашний каталог пользователя. Одна строка `~` покрывает обе формы
  # имён, встречающиеся в SberOS (`/home/work/ЛОГИН@sigma.sbrf.ru` и
  # `/home/sigma.sbrf.ru@ЛОГИН`), — разбирать имя не требуется.
  #
  # Раньше здесь стоял список рабочих папок, потому что под наблюдение inotify
  # попадает каждый вложенный подкаталог и большое дерево упирается в
  # fs.inotify.max_user_watches. Теперь это учтено: мусорные каталоги
  # (.cache, node_modules, .git, venv) не получают наблюдения вовсе, отказ по
  # одному пути больше не выключает наблюдение по остальным, а пропущенное
  # подбирает периодический полный проход (full_rescan_interval). Если лимит
  # всё же мал, его можно поднять
  # (`sysctl fs.inotify.max_user_watches=524288`) либо ограничить глубину
  # наблюдения параметром file_scan_cfg.max_depth.
  #
  # ВНИМАНИЕ: этот список перебивается сохранённым ~/.ragsearch/user_conf.yml.
  # На машине, где конфиг уже сохранён, правка YAML не даст ничего — нужен
  # POST /api/v1/config или удаление user_conf.yml.
  paths:
    - "~"
  # allowed_extensions здесь НЕ задаётся намеренно: параметр в модели конфига
  # есть, но ни обход, ни watcher его не читают. Реальный фильтр — реестр
  # парсеров (src/parsers): txt, pdf, docx, doc, pptx, xlsx, xls. Дописывание
  # сюда md или py индексацию таких файлов не включит.
  max_size: 104857600 # 100 МиБ

embed_model_cfg:
  model_path: models/rubert-mini-frida

email_poll_interval: 3600
email:
  # Выключена: включение делает индекс существенно больше, а первый проход по
  # многогигабайтному mbox выглядит как зависание. Включать осознанно — через
  # POST /api/v1/config, а не правкой этого файла.
  enabled: false
  index_last_n_days: 90

app_logging_level: INFO
